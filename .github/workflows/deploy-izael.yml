name: Deploy Izael to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "izael/**"
      - ".github/workflows/deploy-izael.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-izael
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./izael
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: izael/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:github
        env:
          NEXT_PUBLIC_BASE_PATH: /izael

      - name: Prepare Pages artifact
        run: |
          mkdir -p ../publish/izael
          rsync -a ../ ./../publish \
            --exclude .git \
            --exclude .github \
            --exclude .claude \
            --exclude .DS_Store \
            --exclude publish \
            --exclude izael
          rsync -a ./out/ ../publish/izael/ --exclude .DS_Store
          touch ../publish/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
